services:
  frontend-test-runner:
    image: wycliffeassociates/doc-ui-tests:local
    ipc: "host"
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
      fileserver:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      - CI=true
      # "current/total", e.g. "2/4". Set by the CI matrix; defaults to the full suite locally.
      - PLAYWRIGHT_SHARD=${PLAYWRIGHT_SHARD:-1/1}
    #   - FRONTEND_API_URL=http://frontend/
    network_mode: host

volumes:
  shared:

networks:
  test-runner:
